<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nearby on PinPal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page">
  <main class="page page-width">
    <h1 class="page-title">Nearby</h1>

    <section class="card share-card" aria-label="Your location">
      <p id="location-status" role="status">Checking your location…</p>
      <button class="button button-primary" id="share-button" type="button">Share my location</button>
    </section>

    <p class="notice" id="ghost-notice" hidden>
      Ghost Mode is on, so nobody can find you here. You can turn it off in your
      <a href="/profile.html">profile</a>.
    </p>

    <div class="filters">
      <div class="filter">
        <label for="radius">Distance</label>
        <select id="radius">
          <option value="1">Within 1 km</option>
          <option value="5" selected>Within 5 km</option>
          <option value="10">Within 10 km</option>
          <option value="25">Within 25 km</option>
        </select>
      </div>
      <div class="filter">
        <label for="interest">Interest</label>
        <!-- nearby.js adds one option for each interest in constants.js. -->
        <select id="interest">
          <option value="">All interests</option>
        </select>
      </div>
      <div class="filters-actions">
        <div class="segmented" role="group" aria-label="Show results as">
          <button type="button" id="list-button" aria-pressed="true">List</button>
          <button type="button" id="map-button" aria-pressed="false">Map</button>
        </div>
        <button class="button button-secondary" id="refresh-button" type="button">Refresh</button>
      </div>
    </div>

    <p class="form-error" id="action-error" role="alert" hidden></p>

    <div id="results-state"></div>
    <ul class="person-list" id="results-list" hidden></ul>
    <div class="map" id="map" hidden></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/js/nearby.js"></script>
</body>
</html>
