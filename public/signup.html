<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up for PinPal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <a class="logo" href="/" aria-label="PinPal home">
    <svg class="logo-pin" viewBox="0 0 24 32" aria-hidden="true">
      <path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 32 12 32s12-11.2 12-20.1C24 5.3 18.6 0 12 0z"/>
      <circle cx="12" cy="12" r="4.5"/>
    </svg>
    <span>PinPal</span>
  </a>

  <main class="card auth-card">
    <h1>Create your account</h1>

    <!-- novalidate leaves every check to the server, so there is only one set of rules. -->
    <form id="signup-form" novalidate>
      <p class="form-error" id="form-error" role="alert" hidden></p>

      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-error">
        <p class="field-error" id="name-error" hidden></p>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" aria-describedby="username-hint username-error">
        <p class="field-hint" id="username-hint">3–20 letters, numbers or underscores</p>
        <p class="field-error" id="username-error" hidden></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
        <p class="field-error" id="email-error" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               aria-describedby="password-hint password-error">
        <p class="field-hint" id="password-hint">At least 8 characters</p>
        <p class="field-error" id="password-error" hidden></p>
      </div>

      <fieldset class="field color-field">
        <legend>Avatar color</legend>
        <div class="color-picker">
          <div class="avatar avatar-large" id="avatar-preview" aria-hidden="true">?</div>
          <!-- auth.js adds one radio button for each color in constants.js. -->
          <div class="color-options" id="color-options"></div>
        </div>
        <p class="field-error" id="avatarColor-error" hidden></p>
      </fieldset>

      <button class="button button-primary button-full" type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
